[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-park"
version = "0.5.0"
description = "DNS server for parking domains securely"
authors  = [
    {name = "Nicholas Hairs", email = "info+domain-park@nicholashairs.com"},
]

# Dependency Information
requires-python = ">=3.10"
dependencies = [
    "nserver~=3.0",
    "netifaces",
]

# Extra information
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Topic :: Internet",
    "Topic :: Internet :: Name Service (DNS)",
]

[project.urls]
homepage = "https://github.com/nhairs/domain-park"

[project.optional-dependencies]
dev = [  # Centralise dev dependencies
    ## Building Python Package
    "setuptools",
    "wheel",
    ## Formatting / Linting
    "black",
    "pylint",
    "mypy",
    "validate-pyproject",
    ## Testing
    "pytest",
    ## Docs
    "mkdocs",
    "mkdocs-material>=8.5",
    "mkdocs-awesome-pages-plugin",
    "mdx_truly_sane_lists",
    ## REPL
    "bpython",
]

[project.scripts]
domain-park = "domain_park.cli:main"

[tool.black]
line-length = 100
