name: Check website

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-*.yml'
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/website-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify
      - uses: actions/upload-artifact@v7
        with:
          name: website-review
          path: website/dist
